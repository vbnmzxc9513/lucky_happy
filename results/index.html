<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本輪成績 · Lucky Horse</title><link rel="stylesheet" href="results.css"></head><body><main>
<a href="/manage">返回工作人員選單</a><h1>本輪成績</h1><p>最近 10 場完賽快照，重置遊戲後仍保留。</p>
<p id="warning" role="alert"></p><button id="refresh">重新整理</button>
<label>選擇場次<select id="matches"></select></label><p id="empty" hidden>尚無完賽紀錄，正式比賽完賽後將自動保存。</p>
<section id="detail" hidden><h2 id="summary"></h2><p id="metadata"></p>
<h2>勝隊完整成員</h2><div id="winners"></div>
<h2>隊伍最終排名</h2><div id="teams"></div>
<h2>全部玩家成績</h2><div class="filters"><label>隊伍<select id="team"><option value="">全部隊伍</option></select></label><label class="check"><input id="only-winners" type="checkbox">只顯示勝隊</label><label>排序<select id="sort"><option value="correctCount">答對數</option><option value="tapCount">點擊數</option><option value="nickname">暱稱</option></select></label></div>
<p id="count"></p><div id="players"></div><div class="downloads"><button id="json">下載此場 JSON</button><button id="csv">匯出此場 CSV</button></div>
</section></main><script src="results.js"></script></body></html>
