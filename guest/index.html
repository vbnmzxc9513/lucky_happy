<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>❖ Lucky Horse ❖ 浪漫婚禮互動</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Noto+Serif+TC:wght@600;700;900&family=Outfit:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/guest/css/guest.css?v=8">
</head>
<body>
    <div id="mobile-app">
        <!-- 頂部狀態列 -->
        <header id="mobile-header">
            <div class="user-profile">
                <span id="header-avatar">🙂</span>
                <span id="header-nickname">登入中...</span>
            </div>
            <div id="header-team" class="team-badge">尚未選隊</div>
        </header>

        <!-- 1. 登入與設定暱稱畫面 (SCREEN_LOGIN) -->
        <section id="screen-login" class="screen active">
            <div class="card-box">
                <h1>加入阿平小聶婚禮小遊戲</h1>
                <p class="sub-text">請選擇您的代表頭像與輸入賓客稱呼</p>

                <div class="form-group">
                    <label>您的姓名 / 祝福暱稱：</label>
                    <input type="text" id="input-nickname" placeholder="例如：黑皮貓" maxlength="12" autocomplete="off">
                </div>

                <div class="form-group">
                    <label>選擇個人代表頭像：</label>
                    <div id="avatar-grid" class="avatar-grid">
                        <span class="avatar-opt selected" data-val="🥳">🥳</span>
                        <span class="avatar-opt" data-val="😎">😎</span>
                        <span class="avatar-opt" data-val="😻">😻</span>
                        <span class="avatar-opt" data-val="👑">👑</span>
                        <span class="avatar-opt" data-val="🐶">🐶</span>
                        <span class="avatar-opt" data-val="🐱">🐱</span>
                        <span class="avatar-opt" data-val="🚀">🚀</span>
                        <span class="avatar-opt" data-val="🍻">🍻</span>
                        <span class="avatar-opt" data-val="💖">💖</span>
                        <span class="avatar-opt" data-val="🔥">🔥</span>
                        <span class="avatar-opt" data-val="🎩">🎩</span>
                        <span class="avatar-opt" data-val="👰">👰</span>
                        <span class="avatar-opt" data-val="🤵">🤵</span>
                        <span class="avatar-opt" data-val="🦄">🦄</span>
                        <span class="avatar-opt" data-val="🎈">🎈</span>
                        <span class="avatar-opt" data-val="🎂">🎂</span>
                        <span class="avatar-opt" data-val="🏆">🏆</span>
                        <span class="avatar-opt" data-val="💎">💎</span>
                        <span class="avatar-opt" data-val="🍾">🍾</span>
                        <span class="avatar-opt" data-val="✨">✨</span>
                    </div>
                </div>

                <button id="btn-join" class="btn-block btn-gradient">🎉 確定名稱，進入選隊</button>
                <p id="login-error" class="error-msg"></p>
            </div>
        </section>

        <!-- 2. 隊伍選擇畫面 (SCREEN_TEAM_SELECT) -->
        <section id="screen-team-select" class="screen">
            <div class="card-box team-select-box">
                <h2>選擇您要加入的黑皮陣營</h2>
                <p class="sub-text">為心儀的黑皮隊伍加油！隨時點擊可更換陣營</p>

                <div class="team-choice-grid" id="dynamic-teams-container">
                    <!-- Teams will be dynamically rendered here by guest-app.js -->
                </div>
            </div>
        </section>

        <!-- 3. 賽馬狂點控台畫面 (SCREEN_RACING) -->
        <section id="screen-racing" class="screen">
            <div class="race-control-area">
                <div class="team-indicator" id="my-team-banner">
                    你現在是 <strong id="my-team-name">🔴 紅隊</strong> 的應援主力！
                </div>

                <!-- 巨大點擊應援按鈕 -->
                <div class="tap-zone">
                    <button id="btn-tap" class="giant-tap-btn">
                        <span class="tap-icon">🐎</span>
                        <span class="tap-label">點擊衝刺<br>幸福加速！</span>
                    </button>
                    <div id="tap-feedback-layer" class="tap-effect"></div>
                </div>

                <!-- 狀態與進度提示 -->
                <div class="race-footer">
                    <div id="my-stun-alert" class="stun-alert" style="display: none;">
                        ⚠️ 隊伍暈眩停滯中！點擊暫時無效！
                    </div>
                    <p class="tap-tip">💡 提示：點得越快，隊伍衝得越遠！</p>
                </div>
            </div>
        </section>

        <!-- 4. 關卡答題分屏控台 (SCREEN_QUIZ) -> 只有選項 A/B/C/D！沒有題目文字！ -->
        <section id="screen-quiz" class="screen">
            <div class="card-box quiz-ctrl-box">
                <div class="quiz-top">
                    <h2>🚨 突襲答題關卡 🚨</h2>
                    <p class="quiz-instruction">請抬頭看大螢幕的題目，並在下方點擊選項！</p>
                    <div class="quiz-mobile-timer">倒數 <span id="mobile-quiz-timer">10</span> 秒</div>
                </div>

                <!-- 四個巨大選項按鈕 -->
                <div class="options-grid">
                    <button class="opt-btn" data-opt="A"><span class="opt-tag">A</span> <span class="opt-text">選項 A</span></button>
                    <button class="opt-btn" data-opt="B"><span class="opt-tag">B</span> <span class="opt-text">選項 B</span></button>
                    <button class="opt-btn" data-opt="C"><span class="opt-tag">C</span> <span class="opt-text">選項 C</span></button>
                    <button class="opt-btn" data-opt="D"><span class="opt-tag">D</span> <span class="opt-text">選項 D</span></button>
                </div>

                <div id="quiz-lock-msg" class="lock-msg" style="display: none;">
                    🔒 答案已鎖定送出！請等待揭曉！
                </div>
            </div>
        </section>

        <!-- 5. 局間等候與鎖定畫面 (SCREEN_WAITING / SCREEN_LOCKED) -->
        <section id="screen-waiting" class="screen">
            <div class="card-box wait-box">
                <div class="wait-icon">⏳</div>
                <h2 id="wait-title">本局賽事進行中或結束</h2>
                <p id="wait-desc" class="sub-text">請觀看大螢幕投影，精彩賽況揭曉中！<br>下局開始時，您的手機將自動重新開放！</p>
            </div>
        </section>
    </div>

    <!-- 引入 Socket.IO Client 與前端 JS -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared/events.js?v=9"></script>
    <script src="/shared/game-config.js?v=9"></script>
    <script src="/guest/js/tap-handler.js?v=9"></script>
    <script src="/guest/js/quiz-ui.js?v=9"></script>
    <script src="/guest/js/guest-app.js?v=9"></script>
</body>
</html>
