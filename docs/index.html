<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucky Horse Wedding Game</title>
  <style>
    :root {
      --mint: #a9ded1;
      --mint-dark: #2f625c;
      --gold: #f5cf68;
      --gold-dark: #8a6422;
      --ink: #193330;
      --coral: #ff5757;
      --panel: rgba(255, 255, 255, 0.46);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12px 12px, rgba(47, 98, 92, 0.18) 1px, transparent 1px),
        linear-gradient(135deg, #b8eadf 0%, #91d4c8 46%, #f7da83 100%);
      background-size: 22px 22px, cover;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    main {
      width: min(960px, 100%);
      border: 2px solid rgba(255, 255, 255, 0.62);
      background: var(--panel);
      backdrop-filter: blur(8px);
      border-radius: 18px;
      box-shadow: 0 28px 80px rgba(25, 51, 48, 0.22);
      padding: clamp(28px, 5vw, 56px);
    }

    .ribbon {
      display: inline-block;
      padding: 12px 26px;
      background: var(--gold);
      border: 2px solid var(--gold-dark);
      border-radius: 999px;
      color: var(--gold-dark);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 24px 0 12px;
      font-size: clamp(40px, 8vw, 82px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .lead {
      max-width: 700px;
      font-size: clamp(18px, 2.4vw, 26px);
      line-height: 1.55;
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 34px;
    }

    .tile {
      min-height: 136px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.34);
    }

    .tile strong {
      display: block;
      margin-bottom: 10px;
      font-size: 22px;
    }

    .tile span {
      color: var(--mint-dark);
      font-size: 15px;
      line-height: 1.45;
      font-weight: 700;
    }

    .notice {
      margin-top: 30px;
      padding: 18px 22px;
      border-left: 8px solid var(--coral);
      background: rgba(255, 255, 255, 0.42);
      border-radius: 10px;
      font-weight: 800;
      line-height: 1.6;
    }

    code {
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(25, 51, 48, 0.1);
      font-family: Consolas, "Courier New", monospace;
    }

    @media (max-width: 720px) {
      body {
        padding: 18px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="ribbon">Lucky Horse Wedding Club</div>
    <h1>Lucky Horse</h1>
    <p class="lead">
      婚禮現場專用的即時互動賽馬與答題遊戲。大螢幕主持端、手機賓客端、後台控制台都已整理在這個專案中。
    </p>

    <section class="grid" aria-label="Project entry points">
      <div class="tile">
        <strong>Host</strong>
        <span>投影幕大螢幕畫面，包含大廳、賽馬、答題與最終頒獎。</span>
      </div>
      <div class="tile">
        <strong>Guest</strong>
        <span>賓客手機掃 QR Code 後加入隊伍、點擊加速、回答題目。</span>
      </div>
      <div class="tile">
        <strong>Admin</strong>
        <span>婚禮前彩排、題庫與流程控制使用的後台介面。</span>
      </div>
    </section>

    <div class="notice">
      GitHub Pages 只支援靜態頁面，不能執行 Socket.IO 即時伺服器。正式活動請部署到 DigitalOcean VPS，並以 <code>npm start</code> 啟動 Node.js 服務。
    </div>
  </main>
</body>
</html>
